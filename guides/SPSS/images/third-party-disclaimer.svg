<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="160" viewBox="0 0 1230 160">
<rect x="4" y="4" width="1222" height="152" rx="13" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="1190" y="42" direction="rtl" text-anchor="start" font-size="24" font-weight="bold" fill="#6b7280" font-family="Tahoma,Arial,'Noto Sans Arabic',sans-serif">إخلاء مسؤولية بشأن روابط التنزيل الخارجية</text>
<text x="1190" y="82" direction="rtl" text-anchor="start" font-size="20" fill="#6b7280" font-family="Tahoma,Arial,'Noto Sans Arabic',sans-serif">الصفحة المشار إليها ليست من IBM؛ ولا أضمن سلامة ملفاتها أو قانونية التفعيل المذكور فيها.</text>
<text x="1190" y="118" direction="rtl" text-anchor="start" font-size="20" fill="#6b7280" font-family="Tahoma,Arial,'Noto Sans Arabic',sans-serif">لا تعطل الحماية لتشغيل أي ملف أو كراك. اعتمد التفعيل الرسمي أو ترخيص الجامعة.</text>
</svg>